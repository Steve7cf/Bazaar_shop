name: bazaar
description: Offline Android shop management app for a single-admin, cash-first retail shop.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.6.2

  # State management
  flutter_riverpod: ^2.6.1

  # Onboarding animations
  lottie: ^3.1.3

  # Local persistence (session/theme flags)
  shared_preferences: ^2.3.3

  # Local database — no code generation required
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Auth hashing
  bcrypt: ^1.1.3

  # Charts
  fl_chart: ^0.69.2

  # Exports (business-logic stage)
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  csv: ^6.0.0
  share_plus: ^10.1.2

  # Local notifications (low-stock alerts)
  flutter_local_notifications: ^18.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launcher_icon.png"
  min_sdk_android: 23
